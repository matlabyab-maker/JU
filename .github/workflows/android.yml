name: Android Build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: Build JU Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        shell: bash
        run: |
          set -e
          test -f project.godot
          test -f main.tscn
          test -f export_presets.cfg
          test -f scripts/world.gd
          test -f scripts/plane_controller.gd
          mkdir -p build

      - name: Import project
        shell: bash
        run: godot --headless --editor --path . --quit

      - name: Export Android APK
        shell: bash
        run: |
          set -e
          godot --headless --path . --export-debug "Android" build/JU.apk
          test -s build/JU.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JU-Android-APK
          path: build/JU.apk
          if-no-files-found: error
          retention-days: 14
