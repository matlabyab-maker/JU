name: Android Build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: Build JU Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action defaults to the obsolete SDK package "tools"; install only platform-tools here.
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "platforms;android-34" \
            "build-tools;33.0.2" \
            "build-tools;34.0.0"

      - name: Install Godot 4.3 and Android export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/4.3.stable"
          curl -fL --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" \
            -o "$RUNNER_TEMP/godot/godot.zip"
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot" -maxdepth 1 -type f -name 'Godot_v4.3-stable_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "$GODOT_BIN" > "$RUNNER_TEMP/godot-bin-path"

          curl -fL --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" \
            -o "$RUNNER_TEMP/godot/templates.tpz"
          mkdir -p "$RUNNER_TEMP/godot/template_unpack"
          unzip -q "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/godot/template_unpack"
          TEMPLATE_DIR="$(find "$RUNNER_TEMP/godot/template_unpack" -type d -name templates -print -quit)"
          test -n "$TEMPLATE_DIR"
          cp "$TEMPLATE_DIR"/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/android_release.apk"

      - name: Configure Godot Android paths and debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          ANDROID_SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}" 
          test -n "$ANDROID_SDK_DIR"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -noprompt
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_DIR"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_password = "android"
          EOF
          cat "$HOME/.config/godot/editor_settings-4.tres"

          # Make the Android export preset explicitly use the generated debug keystore.
          python3 - <<'PYCONFIG'
          from pathlib import Path
          import os
          path = Path("export_presets.cfg")
          text = path.read_text()
          text = text.replace('package/signed=false', 'package/signed=true')
          values = {
              'keystore/debug': os.path.join(os.environ['HOME'], '.android', 'debug.keystore'),
              'keystore/debug_user': 'androiddebugkey',
              'keystore/debug_password': 'android',
          }
          lines = text.splitlines()
          for key, value in values.items():
              prefix = key + '='
              replacement = f'{key}="{value}"'
              found = False
              for i, line in enumerate(lines):
                  if line.startswith(prefix):
                      lines[i] = replacement
                      found = True
              if not found:
                  insert_at = next(i for i, line in enumerate(lines) if line.strip() == '[preset.0.options]') + 1
                  lines.insert(insert_at, replacement)
          if 'package/signed=true' not in lines:
              lines.append('package/signed=true')
          path.write_text('
'.join(lines) + '
')
          print('
'.join(line for line in lines if line.startswith(('package/signed=', 'keystore/debug'))))
          PYCONFIG

      - name: Import and validate JU project
        shell: bash
        run: |
          set -euo pipefail
          GODOT_BIN="$(cat "$RUNNER_TEMP/godot-bin-path")"
          test -f project.godot
          test -f main.tscn
          test -f export_presets.cfg
          "$GODOT_BIN" --headless --editor --path . --quit

      - name: Export Android APK
        shell: bash
        run: |
          set -euo pipefail
          GODOT_BIN="$(cat "$RUNNER_TEMP/godot-bin-path")"
          mkdir -p build
          "$GODOT_BIN" --headless --path . --export-debug "Android" build/JU.apk
          test -s build/JU.apk
          # Fail the build if the produced APK is unsigned or has an invalid signature.
          APKSIGNER="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/build-tools/34.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs build/JU.apk
          ls -lh build/JU.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JU-Android-APK
          path: build/JU.apk
          if-no-files-found: error
          retention-days: 14
